<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Biodata Lengkap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Menu Navigasi -->
        <nav class="menu-nav">
            <a href="index.html" class="btn-menu active">Input Biodata</a>
            <a href="proses.php?aksi=lihat" class="btn-menu">Lihat Data Tersimpan</a>
        </nav>

        <h2>Formulir Biodata Peserta</h2>
        <p class="subtitle">Silakan lengkapi seluruh data di bawah ini dengan benar.</p>

        <form id="biodataForm" action="proses.php" method="POST" enctype="multipart/form-data" novalidate>
            <!-- Text -->
            <div class="form-group">
                <label for="nama">Nama Lengkap *</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="pin">PIN / Kode Akses (Min. 6 Karakter) *</label>
                <input type="password" id="pin" name="pin" placeholder="******">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Alamat Email *</label>
                <input type="email" id="email" name="email" placeholder="contoh@email.com">
            </div>

            <!-- Number & Date dalam satu baris -->
            <div class="form-row">
                <div class="form-group half">
                    <label for="usia">Usia *</label>
                    <input type="number" id="usia" name="usia" min="15" max="100" placeholder="15 - 100">
                </div>
                <div class="form-group half">
                    <label for="tgl_lahir">Tanggal Lahir *</label>
                    <input type="date" id="tgl_lahir" name="tgl_lahir">
                </div>
            </div>

            <!-- Radio Button -->
            <div class="form-group">
                <label>Jenis Kelamin *</label>
                <div class="inline-group">
                    <label><input type="radio" name="jk" value="Laki-laki"> Laki-laki</label>
                    <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
                </div>
            </div>

            <!-- Checkbox -->
            <div class="form-group">
                <label>Hobi (Pilih minimal 1) *</label>
                <div class="inline-group">
                    <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                    <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                    <label><input type="checkbox" name="hobi[]" value="Coding"> Coding</label>
                    <label><input type="checkbox" name="hobi[]" value="Desain"> Desain</label>
                </div>
            </div>

            <!-- Select / Dropdown -->
            <div class="form-group">
                <label for="pendidikan">Pendidikan Terakhir *</label>
                <select id="pendidikan" name="pendidikan">
                    <option value="">-- Pilih Pendidikan --</option>
                    <option value="SMA/SMK">SMA/SMK</option>
                    <option value="D3">Diploma 3 (D3)</option>
                    <option value="S1">Sarjana (S1)</option>
                    <option value="S2">Magister (S2)</option>
                </select>
            </div>

            <!-- Color & File -->
            <div class="form-row">
                <div class="form-group half">
                    <label for="warna">Warna Favorit</label>
                    <input type="color" id="warna" name="warna" value="#0284c7">
                </div>
                <div class="form-group half">
                    <label for="foto">Foto Profil (JPG/PNG) *</label>
                    <input type="file" id="foto" name="foto" accept=".jpg, .jpeg, .png">
                </div>
            </div>

            <!-- Textarea -->
            <div class="form-group">
                <label for="alamat">Alamat Lengkap *</label>
                <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap beserta kode pos"></textarea>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" name="submit" class="btn-submit">Simpan Biodata</button>
                <button type="reset" class="btn-reset">Reset Form</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
