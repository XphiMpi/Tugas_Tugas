
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Mahasiswa - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080d18;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: #006eff;
            filter: blur(180px);
            opacity: 0.18;
            top: -150px;
            left: -150px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            background: #00c8ff;
            filter: blur(180px);
            opacity: 0.12;
            bottom: -150px;
            right: -100px;
            z-index: -1;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 38px 35px;
            background: #101827;
            border: 1px solid rgba(0, 153, 255, 0.35);
            border-radius: 18px;
            position: relative;
            overflow: hidden;

            box-shadow:
                0 0 15px rgba(0, 140, 255, 0.15),
                0 0 35px rgba(0, 140, 255, 0.08),
                0 15px 40px rgba(0, 0, 0, 0.5);

            animation: fadeIn 0.8s ease;
        }

        .login-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;

            background: linear-gradient(
                90deg,
                transparent,
                #008cff,
                #00e5ff,
                #008cff,
                transparent
            );

            box-shadow: 0 0 15px #008cff;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            background: #0b2038;
            border: 1px solid #008cff;
            color: #00c8ff;
            font-size: 27px;
            font-weight: bold;
            box-shadow: 0 0 18px rgba(0, 140, 255, 0.3);
        }

        .login-header h2 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .login-header p {
            color: #8795aa;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 9px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            background: #080f1d;
            border: 1px solid #27364b;
            border-radius: 9px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #009dff;
            box-shadow: 0 0 10px rgba(0, 157, 255, 0.35);
            background: #0b1728;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #00aeff;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        .password-input {
            padding-right: 65px !important;
        }

        /* REMEMBER & FORGOT */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 25px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #8795aa;
        }

        .remember input {
            accent-color: #008cff;
            cursor: pointer;
        }

        .form-options a {
            color: #00aeff;
            text-decoration: none;
        }

        .form-options a:hover {
            color: #66d9ff;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #006eff, #00bfff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 140, 255, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 22px rgba(0, 174, 255, 0.6);
            background: linear-gradient(90deg, #008cff, #00d5ff);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .login-footer {
            text-align: center;
            margin-top: 28px;
        }

        .login-footer p {
            color: #8795aa;
            font-size: 13px;
        }

        .login-footer a {
            color: #00aeff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-footer a:hover {
            color: #66d9ff;
            text-shadow: 0 0 8px #009dff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 22px;
            }

            .login-header h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-header">
            <div class="logo">PM</div>
            <h2>Selamat Datang!</h2>
            <p>Silakan login ke akun Portal Mahasiswa Anda</p>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email Kampus</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Masukkan email kampus"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Kata Sandi</label>

                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Masukkan kata sandi"
                        required
                    >

                    <span
                        class="toggle-password"
                        id="togglePassword"
                    >Lihat</span>
                </div>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Ingat saya
                </label>

                <a href="#" id="forgotPassword">
                    Lupa password?
                </a>
            </div>

            <button type="submit" class="btn-login">
                Login Sekarang
            </button>

        </form>

        <div class="login-footer">
            <p>
                Belum punya akun?
                <a href="index.html">Daftar di sini</a>
            </p>
        </div>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        // SHOW / HIDE PASSWORD
        togglePassword.addEventListener("click", function() {

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Sembunyi";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Lihat";
            }

        });

        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;

            if (email === "" || password === "") {
                alert("Email dan password wajib diisi!");
                return;
            }

            if (password.length < 8) {
                alert("Password minimal 8 karakter!");
                return;
            }

            alert("Login berhasil! Selamat datang di Portal Mahasiswa.");

            loginForm.reset();

            passwordInput.type = "password";
            togglePassword.textContent = "Lihat";

        });

        document.getElementById("forgotPassword").addEventListener("click", function(event) {
            event.preventDefault();
            alert("Silakan hubungi administrator untuk reset password.");
        });

    </script>

</body>
</html>
