<!DOCTYPE html><html lang="id"><head>     <meta charset="UTF-8">     <title>Portal Mahasiswa - Registrasi</title>     <link rel="stylesheet" href="style.css"></head><body>     <div class="form-container">         <div class="form-header">            <h2>Buat Akun Baru</h2>            <p>Silakan isi data diri Anda</p>         </div>
         <form id="registerForm">            <div class="input-group">                 <label for="nama">Nama Lengkap</label>                 <input type="text" id="nama" required>            </div>
            <div class="input-group">                 <label for="email">Email Kampus</label>                 <input type="email" id="email" required>            </div>
            <div class="input-group">                 <label for="password">Kata Sandi</label>                 <input type="password" id="password" required>            </div>
            <div class="input-group">                 <label for="confirmPassword">Konfirmasi Kata Sandi</label>                 <input type="password" id="confirmPassword" required>            </div>
            <button type="submit" class="btn-submit">Daftar Sekarang</button>         </form>                 <div class="form-footer">            <p>Sudah punya akun? <a href="#">Login di sini</a></p>         </div>     </div>         <script src="script.js"></script></body>
            </html>
